basePath: /
definitions:
  github_com_trailmemo_internal_agent_dto.ArtifactCommitRequest:
    properties:
      commit_type:
        description: '"create_route" / "create_post"'
        type: string
      idempotency_key:
        description: 幂等键
        type: string
      is_public:
        description: 是否公开（仅 create_route）
        type: integer
    required:
    - commit_type
    - idempotency_key
    type: object
  github_com_trailmemo_internal_agent_dto.ArtifactCommitResponse:
    properties:
      artifact_id:
        description: 产物 ID
        type: string
      entity_id:
        description: 业务实体 ID
        type: integer
      entity_type:
        description: route / post
        type: string
      status:
        description: committed
        type: string
    type: object
  github_com_trailmemo_internal_agent_dto.CapabilityResponse:
    properties:
      default_mode:
        type: string
      enabled:
        type: boolean
      intents:
        items:
          type: string
        type: array
      max_steps:
        type: integer
      max_tool_calls:
        type: integer
      stage:
        type: string
      tools:
        items:
          $ref: '#/definitions/github_com_trailmemo_internal_agent_tools.ToolDescriptor'
        type: array
    type: object
  github_com_trailmemo_internal_agent_dto.ChatLoopResponse:
    properties:
      content:
        type: string
      finish_reason:
        type: string
      latency_ms:
        type: integer
      steps:
        type: integer
      tool_calls:
        type: integer
      total_tokens:
        type: integer
    type: object
  github_com_trailmemo_internal_agent_dto.ChatRequest:
    properties:
      message:
        type: string
      session_id:
        description: 可选，用于多轮对话
        type: string
    required:
    - message
    type: object
  github_com_trailmemo_internal_agent_dto.CheckpointDraftData:
    properties:
      address:
        type: string
      arrive_time:
        type: string
      city:
        type: string
      description:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      sequence:
        type: integer
      stay_duration:
        type: integer
    type: object
  github_com_trailmemo_internal_agent_dto.HealthResponse:
    properties:
      default_mode:
        type: string
      enabled:
        type: boolean
      llm_configured:
        type: boolean
      request_timeout:
        type: string
      stage:
        type: string
      status:
        type: string
      stream_timeout:
        type: string
    type: object
  github_com_trailmemo_internal_agent_dto.RecommendItem:
    properties:
      city:
        type: string
      days:
        type: integer
      estimated_budget:
        type: integer
      reason:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  github_com_trailmemo_internal_agent_dto.RecommendRequest:
    properties:
      budget:
        type: integer
      days:
        type: integer
      interests:
        items:
          type: string
        type: array
      query:
        type: string
      travel_type:
        type: string
    required:
    - query
    type: object
  github_com_trailmemo_internal_agent_dto.RecommendResponse:
    properties:
      artifact_id:
        type: string
      fallback:
        type: boolean
      items:
        items:
          $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.RecommendItem'
        type: array
      run_id:
        type: string
      warnings:
        items:
          type: string
        type: array
    type: object
  github_com_trailmemo_internal_agent_dto.RemixChangeItem:
    properties:
      action:
        description: added/removed/modified
        type: string
      point:
        description: 打卡点名称
        type: string
      reason:
        description: 变更原因
        type: string
    type: object
  github_com_trailmemo_internal_agent_dto.RemixRequest:
    properties:
      budget:
        type: integer
      days:
        type: integer
      query:
        type: string
      travel_styles:
        items:
          type: string
        type: array
    required:
    - query
    type: object
  github_com_trailmemo_internal_agent_dto.RemixResponse:
    properties:
      approval_required:
        type: boolean
      artifact_id:
        type: string
      change_summary:
        items:
          $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.RemixChangeItem'
        type: array
      next_action:
        type: string
      route_draft:
        $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.RouteDraftData'
      run_id:
        type: string
      source_route_id:
        type: integer
      warnings:
        items:
          type: string
        type: array
    type: object
  github_com_trailmemo_internal_agent_dto.RenameSessionRequest:
    properties:
      title:
        type: string
    required:
    - title
    type: object
  github_com_trailmemo_internal_agent_dto.RouteDraftData:
    properties:
      checkpoints:
        items:
          $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.CheckpointDraftData'
        type: array
      end_city:
        type: string
      estimated_budget:
        type: integer
      estimated_hours:
        type: integer
      start_city:
        type: string
      summary:
        type: string
      title:
        type: string
    type: object
  github_com_trailmemo_internal_agent_dto.RouteDraftRequest:
    properties:
      budget:
        description: 预算（元）
        type: integer
      days:
        description: 出行天数
        type: integer
      query:
        description: 用户自然语言需求
        type: string
      start_city:
        description: 出发城市
        type: string
      target_city:
        description: 目标城市
        type: string
      travel_styles:
        description: 旅行风格标签
        items:
          type: string
        type: array
    required:
    - query
    type: object
  github_com_trailmemo_internal_agent_dto.RouteDraftResponse:
    properties:
      approval_required:
        description: 是否需要确认
        type: boolean
      artifact_id:
        description: 产物 ID
        type: string
      next_action:
        description: 后续操作
        type: string
      route_draft:
        allOf:
        - $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.RouteDraftData'
        description: 路线草稿数据
      run_id:
        description: Agent 运行 ID
        type: string
      warnings:
        description: 警告
        items:
          type: string
        type: array
    type: object
  github_com_trailmemo_internal_agent_dto.SessionDetailResponse:
    properties:
      expired:
        type: boolean
      message_count:
        type: integer
      messages:
        items:
          $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.SessionMsg'
        type: array
      session_id:
        type: string
      title:
        type: string
    type: object
  github_com_trailmemo_internal_agent_dto.SessionInfo:
    properties:
      created_at:
        type: string
      last_message_at:
        type: string
      message_count:
        type: integer
      model:
        type: string
      session_id:
        type: string
      title:
        type: string
    type: object
  github_com_trailmemo_internal_agent_dto.SessionListResponse:
    properties:
      sessions:
        items:
          $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.SessionInfo'
        type: array
      total:
        type: integer
    type: object
  github_com_trailmemo_internal_agent_dto.SessionMsg:
    properties:
      content:
        type: string
      role:
        type: string
    type: object
  github_com_trailmemo_internal_agent_dto.TravelNoteRequest:
    properties:
      include_checkin_content:
        type: boolean
      include_images:
        type: boolean
      route_id:
        type: integer
      style:
        description: story/journal/guide/social/poetic
        type: string
    required:
    - route_id
    type: object
  github_com_trailmemo_internal_agent_dto.TravelNoteResponse:
    properties:
      approval_required:
        type: boolean
      artifact_id:
        type: string
      content:
        type: string
      image_refs:
        items:
          type: string
        type: array
      next_action:
        type: string
      run_id:
        type: string
      suggested_tags:
        items:
          type: string
        type: array
      title:
        type: string
      warnings:
        items:
          type: string
        type: array
    type: object
  github_com_trailmemo_internal_agent_memory.PreferenceUpdate:
    properties:
      budget_range:
        type: string
      companion_types:
        items:
          type: string
        type: array
      interests:
        items:
          type: string
        type: array
      pace:
        type: string
      preferred_cities:
        items:
          type: string
        type: array
      travel_type:
        type: string
    type: object
  github_com_trailmemo_internal_agent_tools.Permission:
    enum:
    - read
    - draft_write
    - user_write
    - public_action
    - dangerous
    type: string
    x-enum-comments:
      PermissionDangerous: 危险操作权限
      PermissionDraftWrite: 草稿写入权限
      PermissionPublicAction: 公共操作权限
      PermissionRead: 读取权限
      PermissionUserWrite: 用户写入权限
    x-enum-descriptions:
    - 读取权限
    - 草稿写入权限
    - 用户写入权限
    - 公共操作权限
    - 危险操作权限
    x-enum-varnames:
    - PermissionRead
    - PermissionDraftWrite
    - PermissionUserWrite
    - PermissionPublicAction
    - PermissionDangerous
  github_com_trailmemo_internal_agent_tools.ToolDescriptor:
    properties:
      description:
        description: 工具描述
        type: string
      enabled:
        description: 是否启用
        type: boolean
      name:
        description: 工具名称
        type: string
      permission:
        allOf:
        - $ref: '#/definitions/github_com_trailmemo_internal_agent_tools.Permission'
        description: 工具权限
      phase:
        description: 工具阶段
        type: string
    type: object
  github_com_trailmemo_pkg_response.Response:
    properties:
      code:
        example: 200
        type: integer
      data: {}
      error_code:
        example: ROUTE_NOT_FOUND
        type: string
      message:
        example: success
        type: string
      request_id:
        type: string
    type: object
  internal_handler.ChangePasswordRequest:
    properties:
      newPassword:
        example: "654321"
        maxLength: 128
        minLength: 6
        type: string
      oldPassword:
        example: "123456"
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  internal_handler.CheckpointInput:
    properties:
      address:
        example: 成都市青羊区宽窄巷子
        type: string
      arriveTime:
        example: 2024-06-01 10:00
        type: string
      city:
        example: 成都
        type: string
      description:
        example: 成都著名景点
        type: string
      latitude:
        example: 30.6562
        type: number
      longitude:
        example: 104.0657
        type: number
      name:
        example: 宽窄巷子
        type: string
      photoURL:
        example: https://example.com/photo.jpg
        type: string
      sequence:
        example: 1
        type: integer
      stayDuration:
        example: 120
        type: integer
    required:
    - name
    - sequence
    type: object
  internal_handler.CopyRouteRequest:
    properties:
      isPublic:
        example: 1
        type: integer
    type: object
  internal_handler.CreateCheckinRequest:
    properties:
      checkpoint_id:
        example: 1
        type: integer
      content:
        example: 这里的美食太好吃了！
        type: string
      latitude:
        example: 30.6562
        type: number
      longitude:
        example: 104.0657
        type: number
      photo_url:
        example: https://example.com/checkin.jpg
        type: string
      rating:
        example: 5
        maximum: 5
        minimum: 1
        type: integer
      route_id:
        example: 1
        type: integer
    required:
    - checkpoint_id
    - route_id
    type: object
  internal_handler.CreateCommentRequest:
    properties:
      content:
        example: 评论内容
        type: string
      parent_id:
        example: 0
        type: integer
      post_id:
        example: 1
        type: integer
    required:
    - content
    - post_id
    type: object
  internal_handler.CreatePostRequest:
    properties:
      content:
        example: 这次旅行太棒了！
        type: string
      images:
        example: https://example.com/photo1.jpg,https://example.com/photo2.jpg
        type: string
      route_id:
        example: 1
        type: integer
      title:
        example: 我的旅行分享
        type: string
    required:
    - content
    - title
    type: object
  internal_handler.CreateRouteRequest:
    properties:
      checkpoints:
        items:
          $ref: '#/definitions/internal_handler.CheckpointInput'
        type: array
      coverImage:
        example: https://example.com/cover.jpg
        type: string
      description:
        example: 成都美食之旅
        type: string
      endCity:
        example: 成都
        type: string
      estimatedHours:
        example: 24
        type: number
      isPublic:
        example: 1
        type: integer
      startCity:
        example: 成都
        type: string
      title:
        example: 成都三日游
        type: string
      totalDistance:
        example: 100.5
        type: number
    required:
    - endCity
    - startCity
    - title
    type: object
  internal_handler.LoginRequest:
    properties:
      password:
        example: "123456"
        type: string
      username:
        example: testuser
        type: string
    required:
    - password
    - username
    type: object
  internal_handler.RegisterRequest:
    properties:
      email:
        example: test@example.com
        type: string
      password:
        example: "123456"
        maxLength: 128
        minLength: 6
        type: string
      phone:
        example: "+8613800138000"
        type: string
      username:
        example: testuser
        maxLength: 64
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  internal_handler.ToggleFavoriteRequest:
    properties:
      route_id:
        example: 1
        type: integer
    required:
    - route_id
    type: object
  internal_handler.ToggleLikeRequest:
    properties:
      target_id:
        example: 1
        type: integer
      target_type:
        example: post
        type: string
    required:
    - target_id
    - target_type
    type: object
  internal_handler.UpdateCheckinRequest:
    properties:
      content:
        example: 更新后的内容
        type: string
      photo_url:
        example: https://example.com/new-photo.jpg
        type: string
      rating:
        example: 4
        maximum: 5
        minimum: 1
        type: integer
    type: object
  internal_handler.UpdateCommentRequest:
    properties:
      content:
        example: 更新后的评论内容
        type: string
    required:
    - content
    type: object
  internal_handler.UpdatePostRequest:
    properties:
      content:
        example: 更新后的内容
        type: string
      images:
        example: https://example.com/new-photo.jpg
        type: string
      title:
        example: 更新后的标题
        type: string
    type: object
  internal_handler.UpdateRouteRequest:
    properties:
      coverImage:
        example: https://example.com/new-cover.jpg
        type: string
      description:
        example: 更新后的描述
        type: string
      endCity:
        example: 成都
        type: string
      estimatedHours:
        example: 36
        type: number
      isPublic:
        example: 1
        type: integer
      startCity:
        example: 成都
        type: string
      title:
        example: 成都三日游（更新）
        type: string
      totalDistance:
        example: 150
        type: number
    type: object
  internal_handler.UpdateUserInfoRequest:
    properties:
      avatar:
        example: https://example.com/avatar.jpg
        type: string
      nickname:
        example: 新昵称
        type: string
    type: object
  internal_handler.WechatLoginRequest:
    properties:
      code:
        example: 081aBc1234567
        type: string
    required:
    - code
    type: object
host: localhost:8087
info:
  contact:
    email: support@example.com
    name: API Support
  description: 迹忆旅图寻迹旅游后端 API 文档
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://example.com/terms
  title: TrailMemo API
  version: 1.0.0
paths:
  /agent/artifacts/{artifact_id}/commit:
    post:
      consumes:
      - application/json
      description: 用户确认后将草稿导入为真实Route或Post，支持幂等
      parameters:
      - description: 产物ID
        in: path
        name: artifact_id
        required: true
        type: string
      - description: 提交请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.ArtifactCommitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_trailmemo_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.ArtifactCommitResponse'
              type: object
      summary: 提交产物到业务实体
      tags:
      - 产物
  /agent/capabilities:
    get:
      description: 返回支持的意图、工具和运行模式
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_trailmemo_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.CapabilityResponse'
              type: object
      summary: Agent 能力列表
      tags:
      - Agent
  /agent/chat:
    post:
      consumes:
      - application/json
      description: 有界推理循环处理用户消息，意图自动路由
      parameters:
      - description: 对话请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_trailmemo_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.ChatLoopResponse'
              type: object
      summary: Agent 对话（非流式）
      tags:
      - 对话
  /agent/chat/stream:
    post:
      consumes:
      - application/json
      description: 通过 Server-Sent Events 实时推送 AI 回复 token
      parameters:
      - description: 对话请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.ChatRequest'
      produces:
      - text/event-stream
      responses: {}
      summary: Agent 流式对话（SSE）
      tags:
      - 对话
  /agent/health:
    get:
      description: 返回 Agent 模块运行状态和 LLM 配置
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_trailmemo_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.HealthResponse'
              type: object
      summary: Agent 健康检查
      tags:
      - Agent
  /agent/metrics:
    get:
      description: 返回累计请求数、成功率、token用量、延迟分布
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_trailmemo_pkg_response.Response'
      summary: Agent 运行指标
      tags:
      - Agent
  /agent/notes/generate:
    post:
      consumes:
      - application/json
      description: 从路线打卡记录自动生成游记草稿
      parameters:
      - description: 游记请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.TravelNoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_trailmemo_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.TravelNoteResponse'
              type: object
      summary: 打卡生成游记
      tags:
      - 游记
  /agent/preferences:
    get:
      description: 返回AI从用户行为中学习到的偏好快照
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_trailmemo_pkg_response.Response'
      summary: 查看AI画像
      tags:
      - 偏好
    put:
      consumes:
      - application/json
      description: 用户显式设置旅行偏好
      parameters:
      - description: 偏好更新
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_trailmemo_internal_agent_memory.PreferenceUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_trailmemo_pkg_response.Response'
      summary: 手动更新偏好
      tags:
      - 偏好
  /agent/preferences/memory:
    delete:
      description: 删除所有AI学到的用户偏好数据
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_trailmemo_pkg_response.Response'
      summary: 清空AI记忆
      tags:
      - 偏好
  /agent/recommend:
    post:
      consumes:
      - application/json
      description: 根据用户需求和历史偏好生成目的地推荐
      parameters:
      - description: 推荐请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.RecommendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_trailmemo_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_trailmemo_internal_agent_dto.RecommendResponse'
              type: object
      summary: 旅行推荐
      tags:
      - 推荐
